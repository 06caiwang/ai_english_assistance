server:
  port: 8080

spring:
  application:
    name: english-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/english_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # 密码只从环境变量注入，默认值留空，避免明文进仓库
    # 密码从环境变量读取：export MYSQL_PASSWORD=你的密码（或双击 run-dev.bat）
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    # 本地开发默认值；生产必须用环境变量覆盖，否则重启后旧 token 全部失效
    # 本地开发固定值；换值 = 所有已登录设备立刻失效（客户端会收到 401，需重新登录）
    # 部署时用环境变量覆盖：export JWT_SECRET=你自己的随机串
    secret: ${JWT_SECRET:english-app-dev-secret-keep-it-stable-2026}
    expire-hours: 72
  ai:
    base-url: ${AI_BASE_URL:http://127.0.0.1:8081}
  init:
    # 新用户注册赠送金币，够解锁一个 50 币的形象再喂几次食
    welcome-coin: 50

logging:
  level:
    com.example.english: info
